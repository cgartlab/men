name: Argus Design Review

# 云端 argus 评审：PR 打开/同步/重开时自动触发；与本地 chi judge 无关，
# 是独立的云端流程。规则详见 docs/integrations/argus.md。

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:                # 维护者手动重跑

# secrets 直接暴露为 env 变量，供 step 级 fail-fast 检查缺省（参考 v0.5.0 PR #98 / #104）。
# 注意：env 上下文在 jobs.<job_id>.if 不可用（422 parse error），故缺 secret 检查放在 step 内。
# 双引号包裹避免 YAML tag 歧义（PR #110 经验）。
env:
  ARGUS_FLASH_APP_ID: "${{ secrets.ARGUS_FLASH_APP_ID }}"
  ARGUS_FLASH_PRIVATE_KEY: "${{ secrets.ARGUS_FLASH_PRIVATE_KEY }}"
  OPENCODE_API_KEY: "${{ secrets.OPENCODE_API_KEY }}"

# 全局权限最小化（argus 评审成功后会写 issue comment，故需 issues: write）
permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: argus-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true           # 新 push 取消旧评审，避免堆积

jobs:
  argus-review:
    # dependabot 触发的 run 拿不到仓库 secrets（GitHub 安全模型：只认 Dependabot secrets），
    # 下方 fail-fast 必然假红；且 lockfile bump 没有前端设计可评审 → 直接跳过整个 job。
    # 人类 PR 不受影响，缺 secret 仍 fail-fast。复盘见 PR #116。
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15              # 兜底超时（argus 自身有 fallback 队列 + OpenCode 30min 保护）
    # job 级覆盖全局：argus 评审后需 push 产物，GITHUB_TOKEN 需 contents: write（修复 PR #108 push 403）
    # P0 权限最小化与功能平衡，见 PR #110；全局 permissions 段保持 contents: read（库级最小化）
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---- secrets 校验（fail-fast，直接中断 job）----
      - name: 校验密钥存在（fail-fast）
        run: |
          missing=""
          [ "$ARGUS_FLASH_APP_ID" = "" ] && missing="ARGUS_FLASH_APP_ID"
          [ "$ARGUS_FLASH_PRIVATE_KEY" = "" ] && missing="$missing ARGUS_FLASH_PRIVATE_KEY"
          [ "$OPENCODE_API_KEY" = "" ] && missing="$missing OPENCODE_API_KEY"
          if [ -n "$missing" ]; then
            echo "::error::缺少 secrets:$missing"
            echo "::error::配置指南见 docs/integrations/argus.md §3"
            exit 1
          fi
          echo "所有 secrets 就绪"

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.ARGUS_FLASH_APP_ID }}
          private-key: ${{ secrets.ARGUS_FLASH_PRIVATE_KEY }}

      # ---- token 有效性检查（防御性 fail-fast）----
      # actions/create-github-app-token 在私钥无效时不一定报错：step 可能显示
      # success 但 outputs.token 为空字符串。此前 argus 收到空 token 后只报
      # "github-token input is empty"，诊断信息不指向根因（issue #164）。
      # 此处兜底，让失败更早 + 错误信息更明确。
      # SECURITY: token 经 env: 传入，不插值进 run: —— 插值会让 token 明文
      # 进入脚本体与日志，且属 shell 解析前拼接（argus #169/#170 修过的同类模式）。
      - name: Assert app token present
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          if [ -z "$APP_TOKEN" ]; then
            echo "::error::ARGUS_FLASH_PRIVATE_KEY 无效（无法生成 installation token）。请确认是完整 PEM 而非占位符。"
            echo "::error::配置指南见 docs/integrations/argus.md §3"
            exit 1
          fi
          echo "App token 生成成功"

      - name: Run Argus Design Review
        uses: cgartlab/argus/.github/actions/argus-review@main
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          api-key: ${{ secrets.OPENCODE_API_KEY }}
          # 不 pin 模型：使用 argus 自动刷新的队列（config/free-models.yml）。
          # 该队列有 3 层防护——refresh 过滤 deprecated / regions:[] 标记，
          # --check 拦截非法队列，上游 CI 每次 push 校验。
          # 需要排查模型可用性时见 docs/integrations/argus.md §6.2。
          # 消费方配置：使用仓库根 .argus.yml（已在 main，见 commit 48f79c8）
          config-path: .argus.yml