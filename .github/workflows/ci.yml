name: CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate scripts & toolkit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: for f in scripts/*.mjs; do node --check "$f"; done
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Security audit (npm audit)
        run: npm audit --audit-level=high
      - name: Run tests
        run: npm test
      - run: npm run verify
      - name: Verify @opentui/solid resolution
        run: node -e "import('@opentui/solid').then(()=>{console.log('opentui OK');}).catch(e=>{console.error('opentui import FAILED:',e.message);process.exit(1);})"
      - run: node scripts/release.mjs --dry-run
      - run: node scripts/install.mjs --skip-deps --skip-verify --json

  triage:
    name: Auto triage PR
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: write
      pull-requests: write
      issues: write
    concurrency:
      group: triage-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - name: Read PR diff
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          gh pr diff ${{ github.event.pull_request.number }} --name-only > changed-files.txt
          echo "Files:"
          cat changed-files.txt

      - name: Auto label + milestone
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          LABELS=""
          while IFS= read -r file; do
            case "$file" in
              scripts/*.mjs) LABELS="$LABELS,learning,scripts" ;;
              .github/*) LABELS="$LABELS,infra" ;;
              .opencode/agent/*) LABELS="$LABELS,agents" ;;
              .opencode/skills/*) LABELS="$LABELS,skills" ;;
              docs/*) LABELS="$LABELS,docs" ;;
              AGENTS.md) LABELS="$LABELS,meta" ;;
              README.md) LABELS="$LABELS,meta" ;;
              config/*) LABELS="$LABELS,config" ;;
            esac
          done < changed-files.txt
          LABELS=$(echo "$LABELS" | tr ',' '\n' | sort -u | grep -v '^$' | paste -sd,)
          echo "LABELS=$LABELS" >> $GITHUB_ENV
          echo "Determined labels: $LABELS"
          if [ -z "$LABELS" ]; then
            echo "No matching files for triage, skipping"
            exit 0
          fi
          IFS=',' read -ra LARR <<< "$LABELS"
          for l in "${LARR[@]}"; do
            [ -n "$l" ] && gh pr edit ${{ github.event.pull_request.number }} --add-label "$l"
          done
          if echo "$LABELS" | grep -q "learning"; then
            gh pr edit ${{ github.event.pull_request.number }} --milestone "Learning P0" || true
          elif echo "$LABELS" | grep -q "infra"; then
            gh pr edit ${{ github.event.pull_request.number }} --milestone "Infra" || true
          else
            gh pr edit ${{ github.event.pull_request.number }} --milestone "Meta" || true
          fi

      - name: Auto-assign author
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          AUTHOR=$(gh pr view ${{ github.event.pull_request.number }} --json author --jq '.author.login')
          gh pr edit ${{ github.event.pull_request.number }} --add-assignee "@$AUTHOR" || true
          echo "Assigned to @$AUTHOR"

      - name: Auto-project
        continue-on-error: true
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          PROJ=$(node -e "const p=JSON.parse(require('fs').readFileSync('.github/projects.json','utf8'));const o=p['pc-automatic'];console.log(o.number+' '+o.owner)")
          echo "Project: number=${PROJ%% *} owner=${PROJ##* }"
          gh project item-add "${PROJ%% *}" --owner "${PROJ##* }" --url "${{ github.event.pull_request.html_url }}" || true
