name: Argus Design Review

# 云端 argus 评审：PR 打开/同步/重开时自动触发；与本地 chi judge 无关，
# 是独立的云端流程。规则详见 docs/integrations/argus.md。

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:                # 维护者手动重跑

# secrets 直接暴露为 env 变量，供 step 级检查缺省（参考 v0.5.0 PR #98 / #104）。
# 注意：env 上下文在 jobs.<job_id>.if 不可用（422 parse error），故缺 secret 检查放在 step 内。
# 双引号包裹避免 YAML tag 歧义（PR #110 经验）。
env:
  ARGUS_FLASH_APP_ID: "${{ secrets.ARGUS_FLASH_APP_ID }}"
  ARGUS_FLASH_PRIVATE_KEY: "${{ secrets.ARGUS_FLASH_PRIVATE_KEY }}"
  OPENCODE_API_KEY: "${{ secrets.OPENCODE_API_KEY }}"

# 全局权限最小化（argus 评审成功后会写 issue comment，故需 issues: write）
permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: argus-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true           # 新 push 取消旧评审，避免堆积

jobs:
  argus-review:
    # dependabot 触发的 run 拿不到仓库 secrets（GitHub 安全模型：只认 Dependabot secrets），
    # 下方 secrets 检查必然不通过；且 lockfile bump 没有前端设计可评审 → 直接跳过整个 job。
    # 人类 PR 缺 secret 时不再 fail-fast，改为跳过评审并告警（issue #164）。复盘见 PR #116。
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15              # 兜底超时（argus 自身有 fallback 队列 + OpenCode 30min 保护）
    # job 级覆盖全局：argus 评审后需 push 产物，GITHUB_TOKEN 需 contents: write（修复 PR #108 push 403）
    # P0 权限最小化与功能平衡，见 PR #110；全局 permissions 段保持 contents: read（库级最小化）
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---- secrets 校验（缺 secret 时跳过评审，而不是让 job 失败）----
      # 历史：原先缺 secret 直接 exit 1 → 每个未配置 secrets 的人类 PR 都带一个红 check，
      # 与 #155（labeler 误标）同类的「假红噪音」，削弱 CI 信号可信度（issue #164）。
      # 现改为：缺 secret 时输出 warning 并把 has_secrets=false 传给后续步骤，
      # 后续步骤据此跳过。job 结论为 success，但会明确显示「评审未运行」的告警。
      - name: 校验密钥存在
        id: secrets-check
        run: |
          missing=""
          [ "$ARGUS_FLASH_APP_ID" = "" ] && missing="$missing ARGUS_FLASH_APP_ID"
          [ "$ARGUS_FLASH_PRIVATE_KEY" = "" ] && missing="$missing ARGUS_FLASH_PRIVATE_KEY"
          [ "$OPENCODE_API_KEY" = "" ] && missing="$missing OPENCODE_API_KEY"
          if [ -n "$missing" ]; then
            echo "::warning::argus 设计评审未运行：缺少 secrets:$missing"
            echo "::warning::这是配置缺失，不是代码问题。配置指南见 docs/integrations/argus.md §3"
            echo "has_secrets=false" >> "$GITHUB_OUTPUT"
          else
            echo "所有 secrets 就绪"
            echo "has_secrets=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate GitHub App token
        id: app-token
        if: steps.secrets-check.outputs.has_secrets == 'true'
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.ARGUS_FLASH_APP_ID }}
          private-key: ${{ secrets.ARGUS_FLASH_PRIVATE_KEY }}

      - name: Run Argus Design Review
        if: steps.secrets-check.outputs.has_secrets == 'true'
        uses: cgartlab/argus/.github/actions/argus-review@main
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          api-key: ${{ secrets.OPENCODE_API_KEY }}
          # 消费方配置：使用仓库根 .argus.yml（已在 main，见 commit 48f79c8）
          config-path: .argus.yml

      - name: 评审跳过的说明（写入 job summary）
        if: steps.secrets-check.outputs.has_secrets != 'true'
        run: |
          {
            echo "## ⚠️ Argus 设计评审未运行"
            echo ""
            echo "本 job 因以下 secrets 未配置而跳过，**不代表代码有问题**："
            echo ""
            echo '```'
            echo "ARGUS_FLASH_APP_ID / ARGUS_FLASH_PRIVATE_KEY / OPENCODE_API_KEY"
            echo '```'
            echo ""
            echo "配置步骤见 \`docs/integrations/argus.md §3\`。"
            echo "追踪：issue #164"
          } >> "$GITHUB_STEP_SUMMARY"