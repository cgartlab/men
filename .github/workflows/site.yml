name: Site

# PR 阶段补站点构建检查：只在改动 site/** 时跑（GitHub 原生路径过滤，无需脚本分流）。
# 背景：deploy.yml 只在 push main 时构建，PR 阶段对 site/ 零覆盖 —— dependabot 的
# #116（svgo 4.0.2 → 4.1.0，修 GHSA-w27v-7q3p-w38r / GHSA-4vpr-x523-8j87）只能靠
# 手工 npm run build 验证。check-site.mjs 是仓库约定的产物级检查（扫 dist，
# 不依赖活服务器、零常驻进程）。

"on":
  pull_request:
    paths:
      - "site/**"

permissions:
  contents: read

jobs:
  build:
    name: Build site (site/**)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22          # 与 deploy.yml 保持一致
      - name: Install
        working-directory: site
        run: npm ci
      # 源码级质量门：只读 global.css，零依赖、秒级。先于 build 跑，
      # 让配色/令牌回归在 ~1s 内失败，而不是等 astro 构建完。
      # （这两个审计脚本原先只能手工运行，回归无人拦截；见 PR 描述）
      - name: Source quality gates (contrast + token claims)
        working-directory: site
        run: npm run check:source
      - name: Build + artifact check
        working-directory: site
        run: |
          npm run build
          npm run check-site
