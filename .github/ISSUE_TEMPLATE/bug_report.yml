name: Bug report
description: Report a defect in the men agent team system
title: "[bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. Please provide enough detail for us to reproduce.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: A clear description of the bug and its impact.
      placeholder: When running /ultrawork with ..., the agent produced ...
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Minimal steps to reproduce the behavior.
      placeholder: |
        1. Run `opencode`
        2. Type `/ultrawork <task>`
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened instead.
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: Node version, OpenCode version, OS, model backend.
      placeholder: Node v26.2.0 / OpenCode 1.x / Windows 11 / opencode-go
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / evidence
      description: Paste verify output, judge report, or events.jsonl excerpts.
      render: shell
    validations:
      required: false
