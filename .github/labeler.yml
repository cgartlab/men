# auto-label 路径映射表（actions/labeler 语法）
# 根据改动文件自动打标签；sync-labels: true 时会移除不再匹配的标签。
# 本仓库为 OpenCode Agent 团队配置仓库（.opencode 为核心）+ site（Astro 文档站）。
# 原则：type:bug 不参与路径推断（由 issue 模板 labels 承载），文件路径无法区分修复/新增。

🤖 area:agents:
  - changed-files:
      - any-glob-to-any-file: '.opencode/agent/**'

🎯 area:skills:
  - changed-files:
      - any-glob-to-any-file: '.opencode/skills/**'

⌘ area:commands:
  - changed-files:
      - any-glob-to-any-file:
          - '.opencode/command/**'
          - 'gh-flow/**'

🔌 area:plugins:
  - changed-files:
      - any-glob-to-any-file: '.opencode/plugins/**'

📖 area:site:
  - changed-files:
      - any-glob-to-any-file: 'site/**'

🧠 area:knowledge:
  - changed-files:
      - any-glob-to-any-file:
          - 'knowledge/**'
          - 'errors/**'

⚙️ area:infra:
  - changed-files:
      - any-glob-to-any-file:
          - '.github/**'
          - 'scripts/**'
          - 'config/**'
          - 'opencode.json'
          - 'package.json'
          - 'install.ps1'
          - 'install.sh'

📝 type:docs:
  - changed-files:
      - any-glob-to-any-file:
          - 'README.md'
          - 'AGENTS.md'
          - 'CHANGELOG.md'
          - 'CODE_OF_CONDUCT.md'
          - 'CONTRIBUTING.md'
          - 'SECURITY.md'
          - 'docs/**'
          - '.github/ISSUE_TEMPLATE/**'
          - '.github/PULL_REQUEST_TEMPLATE.md'
