name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate scripts & toolkit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Syntax check all scripts
        run: |
          for f in scripts/*.mjs; do
            echo "checking $f"
            node --check "$f"
          done

      - name: Run mechanical verification (men agent)
        run: npm run verify

      - name: Dry-run release bump (no writes)
        run: node scripts/release.mjs --dry-run

      - name: Smoke test installer (no deps, no verify)
        run: node scripts/install.mjs --skip-deps --skip-verify --json

  triage:
    name: Auto triage PR
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: write
      pull-requests: write
      projects: write
    concurrency:
      group: triage-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - name: Auto label milestone assign project
        run: |
          FILES=$(gh pr diff ${{ github.event.pull_request.number }} --name-only)
          LABELS=""
          while IFS= read -r file; do
            case "$file" in
              scripts/*.mjs) LABELS="$LABELS,learning,scripts" ;;
              .github/*) LABELS="$LABELS,infra" ;;
              .opencode/agent/*) LABELS="$LABELS,agents" ;;
              .opencode/skills/*) LABELS="$LABELS,skills" ;;
              docs/*) LABELS="$LABELS,docs" ;;
              AGENTS.md) LABELS="$LABELS,meta" ;;
              README.md) LABELS="$LABELS,meta" ;;
              config/*) LABELS="$LABELS,config" ;;
            esac
          done <<< "$FILES"
          LABELS=$(echo "$LABELS" | tr ',' '\n' | sort -u | grep -v '^$' | paste -sd,)
          echo "LABELS=$LABELS" >> $GITHUB_ENV
          for l in $(echo "$LABELS" | tr ',' '\n'); do
            [ -n "$l" ] && gh pr edit ${{ github.event.pull_request.number }} --add-label "$l"
          done
          if echo "$LABELS" | grep -q "learning"; then
            gh pr edit ${{ github.event.pull_request.number }} --milestone "Learning P0"
          elif echo "$LABELS" | grep -q "infra"; then
            gh pr edit ${{ github.event.pull_request.number }} --milestone "Infra"
          else
            gh pr edit ${{ github.event.pull_request.number }} --milestone "Meta"
          fi
          AUTHOR=$(gh pr view ${{ github.event.pull_request.number }} --json author --jq '.author.login')
          gh pr edit ${{ github.event.pull_request.number }} --add-assignee "@$AUTHOR"
          PROJ=$(node -e "const p=JSON.parse(require('fs').readFileSync('.github/projects.json','utf8'));const o=p['pc-automatic'];console.log(o.number+' '+o.owner)")
          gh project item-add "${PROJ%% *}" --owner "${PROJ##* }" --url "${{ github.event.pull_request.html_url }}" || true
