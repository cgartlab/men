name: Feature request
description: Propose a new capability or improvement for the men agent team
title: "[feat]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement.
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What problem does this solve? Why is it needed?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the feature and how it should behave.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Affected components
      description: Which agent / script / command would change? (men/si/ji/chi/yi/xun, scripts/*, .opencode/*)
    validations:
      required: false
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How do we verify the feature is done (mechanical checks preferred)?
    validations:
      required: false
